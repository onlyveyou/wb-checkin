name: build-windows

# Windows 安装包只能在 Windows 上产出（Tauri 不支持从 macOS 交叉编译）。
# 这里用 GitHub 的 windows-latest 跑一遍：既当编译验证，也直接出 NSIS 安装包。
on:
  workflow_dispatch:
  push:
    # 只认 tag：分支推送不该产出对外分发的安装包。
    # 手动触发（workflow_dispatch）需要工作流文件已在默认分支上，合并进 main 后即可用。
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # beforeBuildCommand 里已经带 `tsc && vite build`，不必单独跑前端构建。
      - name: Install frontend deps
        run: npm ci

      # 内置网关是 node 脚本，Windows 上要 node.exe 才能跑；这个二进制不进仓库（100MB 超过
      # GitHub 单文件上限），构建时现下。版本与 macOS 包里那份保持一致。
      - name: Fetch Windows node for the builtin gateway
        shell: pwsh
        run: |
          $v = "v22.22.2"
          New-Item -ItemType Directory -Force gateway-bundle | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$v/win-x64/node.exe" -OutFile gateway-bundle/node.exe
          Get-Item gateway-bundle/node.exe | Select-Object Length

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Show bundle output
        run: dir src-tauri\target\release\bundle\nsis
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: wb-checkin-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 打 tag 推上来时顺手挂到同名 Release 上（与 macOS 的 dmg 并列）。
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
