[package]
name = "wb-checkin"
version = "0.9.0"
description = "WB 签到 —— WorkBuddy / CodeBuddy 多账号每日自动签到"
authors = ["you"]
edition = "2021"

[lib]
name = "wb_checkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# 读内存用量：调 mach 的 host_statistics64 / sysctlbyname，避免为一次采样起子进程
libc = "0.2"

# 菜单栏两行标题要绕过 Tauri 的 set_title 直接设 NSAttributedString，
# 只用到 objc2 的 msg_send，不引入整套 objc2-app-kit（它已在依赖树里）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
